name: Release

# 手动触发发版：填版本号 -> 跑全部测试 -> 通过则打 tag + 写 CHANGELOG + 推 Docker Hub / GitHub Container Registry
#
# 推送目标：
#   Docker Hub   anjia0532/discovery-syncer-python:<version>
#   GitHub ghcr.io/anjia0532/discovery-syncer-python:<version>
#
# ghcr.io 用 Actions 内置的 GITHUB_TOKEN 认证，无需任何 GCP/OIDC 配置。
#
# 前置条件（仓库 Settings → Secrets）：
#   HUB_NAME / HUB_PWD  Docker Hub 账号（已有）
#
# ghcr 镜像默认私有：在 Settings → Packages → discovery-syncer-python
# 将可见性改为 Public，或拉取方使用 GITHUB_TOKEN 拉取。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version — 支持 3.0.0 或 v3.0.0（v 前缀可选，会自动归一化）'
        required: true
        type: string
      skip_matrix:
        description: 'Skip Docker multi-version matrix (faster, unit + smoke only)'
        required: false
        type: boolean
        default: false

# contents: 打 tag；packages: 推镜像（ghcr）；
# 不再需要 id-token:write（已移除 gcr OIDC）。
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: discovery-syncer-python
  # Docker Hub 与 ghcr 共用同一个命名空间（个人账户）
  REGISTRY_NS: anjia0532

jobs:
  test:
    name: Test (unit + smoke + matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q --disable-warnings

      - name: App smoke test (real uvicorn + subscription + memory pressure)
        run: python tests/integration/app_smoke.py

      - name: Docker multi-version matrix
        if: ${{ !inputs.skip_matrix }}
        run: |
          cd tests/integration
          bash run_matrix.sh up
          bash run_matrix.sh test
          bash run_matrix.sh down

  release:
    name: Release (tag + changelog + images)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          # 支持两种输入：3.0.0 与 v3.0.0（v 前缀可选）。
          # 归一化后：VERSION=3.0.0（不带 v，用于镜像 tag 与 CHANGELOG），
          #           TAG=v3.0.0（带 v，用于 git tag）。
          RAW="${{ github.event.inputs.version }}"
          RAW="$(echo "$RAW" | tr -d '[:space:]')"

          VERSION="${RAW#v}"      # 去掉可能的前缀 v
          VERSION="${VERSION#V}"  # 兼容大写 V

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::版本号格式错误: ${RAW}（需要 3.0.0 或 v3.0.0，可带 -pre 等后缀）"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "输入 ${RAW} -> 归一化 VERSION=${VERSION}, TAG=v${VERSION}"

      - name: Detect existing tag (idempotent)
        run: |
          # tag 已存在时不报错，改为「跳过创建、继续推镜像与 Release」，
          # 让发版可重跑（修复上次失败后重试的场景）。
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
            echo "::notice::Tag $TAG 已存在，将跳过打 tag，直接复用"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
            echo "Tag $TAG 不存在，将在测试通过后创建"
          fi

      - name: Generate CHANGELOG
        if: env.TAG_EXISTS == 'false'
        run: |
          python scripts/gen_changelog.py --version "$VERSION"

      - name: Commit CHANGELOG (skip if unchanged)
        if: env.TAG_EXISTS == 'false'
        run: |
          # CHANGELOG 已包含该版本（例如本地已手动写入）时无需再提交。
          if git diff --quiet CHANGELOG.md && git ls-files --error-unmatch CHANGELOG.md >/dev/null 2>&1; then
            echo "::notice::CHANGELOG.md 无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION changelog"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create tag (skip if exists)
        if: env.TAG_EXISTS == 'false'
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # 用归一化后的 TAG，避免用户输入 v3.0.0 时标题变成 "vv3.0.0"
          name: ${{ env.TAG }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          # Release 已存在时允许更新（配合 tag 的幂等逻辑，使发版可重跑）
          allowUpdates: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- 登录 Docker Hub + ghcr ------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.HUB_NAME }}
          password: ${{ secrets.HUB_PWD }}

      # ghcr.io 用 Actions 内置 GITHUB_TOKEN，无需任何外部配置。
      # username 用触发工作流的 actor（与 GITHUB_TOKEN 属主一致）。
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- 主镜像（discovery-syncer-python）----------------------------------------
      # 先推 ghcr 再推 Docker Hub；两边共用同一份 build 缓存可省一半构建时间。
      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            maintainer=AnJia <anjia0532@gmail.com>
            org.opencontainers.image.description=从注册中心(如Nacos,Eureka)同步实例信息到网关服务(如Apisix,Kong)
            org.opencontainers.image.title=discovery-syncer-python
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ghcr
          cache-to: type=gha,mode=max,scope=ghcr

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            maintainer=AnJia <anjia0532@gmail.com>
            org.opencontainers.image.description=从注册中心(如Nacos,Eureka)同步实例信息到网关服务(如Apisix,Kong)
            org.opencontainers.image.title=discovery-syncer-python
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dockerhub
          cache-to: type=gha,mode=max,scope=dockerhub

      # ---- 备份镜像（tools/backup.py）------------------------------
      # 主镜像之外必须一并发 backup 镜像，否则发版后备份工具仍是旧版。
      - name: Build and push backup to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/docker/BackupDockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}-backup:${{ env.VERSION }}
            ghcr.io/${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}-backup:latest
            ghcr.io/${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}-backup:${{ github.sha }}
          labels: |
            maintainer=AnJia <anjia0532@gmail.com>
            org.opencontainers.image.description=从注册中心同步实例到网关的备份工具（支持多集群多 kubeconfig）
            org.opencontainers.image.title=discovery-syncer-python-backup
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ghcr-backup
          cache-to: type=gha,mode=max,scope=ghcr-backup

      - name: Build and push backup to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/docker/BackupDockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}-backup:${{ env.VERSION }}
            ${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}-backup:latest
            ${{ env.REGISTRY_NS }}/${{ env.IMAGE_NAME }}-backup:${{ github.sha }}
          labels: |
            maintainer=AnJia <anjia0532@gmail.com>
            org.opencontainers.image.description=从注册中心同步实例到网关的备份工具（支持多集群多 kubeconfig）
            org.opencontainers.image.title=discovery-syncer-python-backup
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dockerhub-backup
          cache-to: type=gha,mode=max,scope=dockerhub-backup
