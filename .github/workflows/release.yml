name: Release

# 手动触发发版：填版本号 -> 跑全部测试 -> 通过则打 tag + 写 CHANGELOG + 推 gcr.io / Docker Hub
#
# 前置条件（仓库 Settings → Variables）：
#   GCP_PROJECT_ID     gcr.io 对应的 GCP 项目 ID
#   GCP_WI_POOL_ID     OIDC workload identity pool ID
#   GCP_WI_PROVIDER_ID OIDC workload identity provider ID
# 前置条件（仓库 Settings → Secrets）：
#   HUB_NAME / HUB_PWD  Docker Hub 账号（已有）
#
# OIDC 配置步骤见 README「发版流程」章节。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 3.0.0)'
        required: true
        type: string
      skip_matrix:
        description: 'Skip Docker multi-version matrix (faster, unit + smoke only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: discovery-syncer-python
  DOCKERHUB_USER: anjia0532

jobs:
  test:
    name: Test (unit + smoke + matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q --disable-warnings

      - name: App smoke test (real uvicorn + subscription + memory pressure)
        run: python tests/integration/app_smoke.py

      - name: Docker multi-version matrix
        if: ${{ !inputs.skip_matrix }}
        run: |
          cd tests/integration
          bash run_matrix.sh up
          bash run_matrix.sh test
          bash run_matrix.sh down

  release:
    name: Release (tag + changelog + images)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式错误: $VERSION (需要 x.y.z，如 3.0.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check tag does not exist
        run: |
          if git ls-remote --tags origin "refs/tags/${{ env.TAG }}" | grep -q .; then
            echo "::error::Tag ${{ env.TAG }} 已存在，请检查版本号"
            exit 1
          fi

      - name: Generate CHANGELOG
        run: |
          python scripts/gen_changelog.py --version "$VERSION"

      - name: Commit CHANGELOG and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION changelog"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: v${{ github.event.inputs.version }}
          body_path: CHANGELOG.md
          generate_release_notes: false

      - name: Auth to gcr.io (OIDC workload identity)
        id: gcr_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: >-
            projects/${{ vars.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/${{ vars.GCP_WI_POOL_ID }}/providers/${{ vars.GCP_WI_PROVIDER_ID }}
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to gcr.io
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: oauth2accesstoken
          password: ${{ steps.gcr_auth.outputs.access_token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.HUB_NAME }}
          password: ${{ secrets.HUB_PWD }}

      - name: Build and push to gcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/docker/Dockerfile
          push: true
          tags: |
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest
            gcr.io/${{ vars.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            maintainer=AnJia <anjia0532@gmail.com>
            org.opencontainers.image.description=从注册中心(如Nacos,Eureka)同步实例信息到网关服务(如Apisix,Kong)
            org.opencontainers.image.title=discovery-syncer-python
            org.opencontainers.image.version=${{ github.event.inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: misc/docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            maintainer=AnJia <anjia0532@gmail.com>
            org.opencontainers.image.description=从注册中心(如Nacos,Eureka)同步实例信息到网关服务(如Apisix,Kong)
            org.opencontainers.image.title=discovery-syncer-python
            org.opencontainers.image.version=${{ github.event.inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
