common:
  syncer-api-key: NopU13xRheZng2hqHAwaI0TF5VHNN05G
discovery-servers:
    nacos1:
        type: nacos
        weight: 100
        prefix: /nacos/v1/
        host: "http://nacos-server:8858"
    eureka1:
        type: eureka
        weight: 100
        prefix: /eureka/
        host: "http://admin:admin@eureka-server:8761"

gateway-servers:
    apisix1:
        type: apisix
        admin-url: http://apisix-server:9080
        prefix: /apisix/admin/
        config:
            X-API-KEY: xxxxxxxx-xxxx-xxxxxxxxxxxx
            version: v3
    kong1:
        type: kong
        admin-url: http://kong-server:8001
        prefix: /
        config:
            targets_uri: /targets/all

targets:
    -   discovery: nacos1
        gateway: apisix1
        enabled: false
        # 拉取间隔
        # 支持crontab格式(5位 * * * * * == 分 时 日 月 周 6位 * * * * * * == 秒 分 时 日 月 周)
        # 特殊值                  | 描述                                                 | 示例
        # @yearly (or @annually) | 每年1月1日 午夜零点零分零秒执行一次                     | 0 0 0 1 1 *
        # @monthly               | 每月1日 午夜零点零分零秒执行一次                        | 0 0 0 1 * *
        # @weekly                | 每周日的午夜零点零分零秒执行一次                        | 0 0 0 * * 0
        # @daily (or @midnight)  | 每天的午夜零点零分零秒执行一次                          | 0 0 0 * * *
        # @hourly                | 每小时的零分零秒执行一次                               | 0 0 * * * *
        # @reboot                | 启动时执行一次                                        | -
        # @every                 | 每多久执行一次(仅支持s(秒)/m(分)/h(时),且一次只能用一种)  | */30 * * * * *
        fetch-interval: "*/30 * * * * *" # every 30 seconds
        maximum-interval-sec: 20 # now - last > ${maximum-interval-sec}sec is lost
        upstream-prefix: test
        name: test
        # 排除指定服务(支持正则)
        exclude-service: []
        config:
            groupName: DEFAULT_GROUP
            namespaceId: test
            template: |
                {
                    "timeout": {
                        "connect": 30,
                        "send": 30,
                        "read": 30
                    },
                    "name": "$name",
                    "nodes": $nodes,
                    "type":"roundrobin",
                    "desc": "auto sync by https://github.com/anjia0532/discovery-syncer-python"
                }
        # 主动健康检查
        healthcheck:
              # 目前仅支持 http/https
              type: http
              # http[s]://ip:port+uri
              uri: /
              # 主动健康检查超时时间，不设置默认30秒，单位是秒，正整数
              timeout-sec: 10
              # 定时作业间隔
              interval: "@every 10s"
              # 保留节点数，不设置默认保留1个，假设一个service有3个节点，min-hosts设置的是3，即使都不健康，也不会去注册中心下线实例
              # 如果一个service有3个节点，min-hosts设置的是2，假设都不健康，则会下线1个实例，保留2个
              min-hosts: 3
              # 健康检查http方法，默认是GET
              method: GET
              # 健康断言 实例状态默认是 unknown
              # 特别的 相同百位数的状态码，可以缩写成 xx，比如 1xx[100-199], 2xx[200-299], 3xx[300-399], 4xx[400-499], 5xx[500-599]
              # 健康检查返回的状态码同时满足 healthy.http_statuses 和 unhealthy.http_statuses 交集 status，则认为是健康节点
              # 比如 http_status 是 401，healthy.http_statuses 是['4xx'], unhealthy.http_statuses 是[401]，则认为是健康节点
              # 比如 http_status 是 401，healthy.http_statuses 是[400], unhealthy.http_statuses 是['4xx']，则认为是不健康节点
              healthy:
                # 如果健康检查 访问 http[s]://ip:port+uri，在timeout超时之前，返回了 http_statuses 指定的状态码，则视为健康节点
                http_statuses: [200]
                # successes 默认是1 ，连续成功超过 successes 次，此节点视为是 healthy, 默认是 unknown
                successes: 1
              # 不健康断言
              unhealthy:
                # 如果健康检查 访问 http[s]://ip:port+uri，超时了则 timeouts 计数增加，未超时正常返回了，检查 http_status ,是否命中 http_statuses
                http_statuses: [404,500,502,503,504]
                # failures 默认是1 ，连续失败超过 failures 次，此节点视为 unhealthy (failures或timeouts任一超过，均视为 unhealthy)
                failures: 1
                # timeouts 默认是1 ，连续失败超过 timeouts 次，此节点视为 unhealthy (failures或timeouts任一超过，均视为 unhealthy)
                timeouts: 1
              # 状态发生变更时 unknown-> healthy,unknown->unhealthy,healthy->unhealthy,unhealthy->healthy
              # 会向 alert.url 推送 webhook,url query参数，key是body，值是jsonobject(类似 {"id":"a848ce01-7891-44f0-9f26-5ede6c9f6211","target_id":"0-apisix-nacos","service":"demo","instance":"10.42.0.98:8085","successes":0,"failures":0,"timeouts":1,"status":"unknown","create_time":"2024-06-26 10:13:49","last_time":"2024-06-26 10:13:58","new_status":"unhealthy","items":{"unhealthy":[{"id":"a848ce01-7891-44f0-9f26-5ede6c9f6211","target_id":"0-apisix-nacos","service":"demo","instance":"10.42.0.98:8085","successes":0,"failures":0,"timeouts":1,"status":"unhealthy","create_time":"2024-06-26 10:13:49.084153"}]}})
              # 如果 alert.url 不配置，则不会推送，也不会报错，method 默认是 GET
              alert:
                url: ""
                method: ""
    -   discovery: eureka1
        gateway: apisix1
        enabled: false
        fetch-interval: "*/10 * * * * *" # every 10 seconds
        upstream-prefix: test-eureka
        name: test-eureka
        maximum-interval-sec: 10
        config:
            template: |
                {
                    "name": "$name",
                    "algorithm": "round-robin",
                    "hash_on": "none",
                    "hash_fallback": "none",
                    "hash_on_cookie_path": "/",
                    "slots": 10000,
                    "healthchecks": {
                        "passive": {
                            "healthy": {
                                "http_statuses": [200, 201, 202, 203, 204, 205, 206, 207, 208, 226, 300, 301, 302, 303, 304, 305, 306, 307, 308],
                                "successes": 0
                            },
                            "type": "http",
                            "unhealthy": {
                                "http_statuses": [429, 500, 503],
                                "timeouts": 0,
                                "http_failures": 0,
                                "tcp_failures": 0
                            }
                        },
                        "active": {
                            "timeout": 1,
                            "https_sni": "example.com",
                            "http_path": "/",
                            "concurrency": 10,
                            "https_verify_certificate": true,
                            "type": "http",
                            "healthy": {
                                "http_statuses": [200, 302],
                                "successes": 0,
                                "interval": 0
                            },
                            "unhealthy": {
                                "http_statuses": [429, 404, 500, 501, 502, 503, 504, 505],
                                "timeouts": 0,
                                "http_failures": 0,
                                "interval": 0,
                                "tcp_failures": 0
                            }
                        },
                        "threshold": 0
                    },
                    "tags": ["discovery-syncer-python-auto"]
                }

# ===========================================================================
# 订阅配置（全部可选，旧 config.yaml 不写这一段也能原样启动）
# ---------------------------------------------------------------------------
# 每个 target 可单独配置 subscribe 块；不写时使用以下默认值：
#   enabled: true / mode: auto / reconcile: true / webhook: true / fallback: true
#
# 也可在 discovery-servers 或 gateway-servers 下显式写 version 覆盖自动探测：
#   discovery-servers.<name>.version: 1 | 2 | 3          # nacos
#   gateway-servers.<name>.version: v2 | v3              # apisix
#   gateway-servers.<name>.version: 2.8.x | 3.7.1        # kong
# 旧的 gateway-servers.<name>.config.version 写法继续兼容。
#
# subscribe:
#   enabled: true
#   mode: auto            # auto | push | webhook | poll | off(完全回退定时轮询)
#   version: ""           # 留空 = 自动探测上游大版本
#   udp-host: 0.0.0.0    # Nacos 1.x/2.x UDP 推送监听地址；容器需暴露该 UDP 端口
#   udp-port: 0           # 0 = 随机端口（端口会随订阅请求带给 Nacos）
#   debounce-ms: 500      # 同一服务连续事件的合并窗口
#   refresh-interval: ""  # UDP 订阅续约 / 新服务发现周期，留空复用 fetch-interval
#   reconcile-interval: "@every 5m"  # 低频全量对账兜底，留空默认 5 分钟
#   push-timeout-sec: 0   # 0 = 按 3 倍续约周期自动判定推送失联并降级
#   reconcile: true       # 是否保留兜底对账（防丢事件）
#   webhook: true         # 是否附带 POST /-/notify 入站回调
#   fallback: true        # 推送不可用时自动叠加快照 diff 增量轮询
#   notify-token: ""      # 入站回调额外令牌（仍受 SYNCER-API-KEY 保护）
# ===========================================================================

# ===========================================================================
# 集群模式（多副本）—— 默认关闭，旧配置无需改动
#
# 单副本部署保持默认（enabled: false），完全不连接 Redis，行为与之前一致。
# 多副本部署（K8s replicas > 1）时开启：各副本通过 Redis 租约选举 leader，
# 只有 leader 装配订阅与定时作业并写网关，其余副本待命并自动接管，
# 避免多副本重复写网关。leader 副本的 /health 保持 UP，follower 也会返回 UP
# （只要 Redis 连通），因此 K8s 不会反复重启待命副本。
#
# cluster:
#   enabled: true                    # 开启集群模式
#   redis-url: "redis://:pwd@127.0.0.1:6379/0"
#   key-prefix: discovery-syncer     # 多套环境共用 Redis 时用于隔离
#   lock-ttl-sec: 30                 # leader 租约 TTL；副本崩溃后最多这么久被接管
#   renew-interval-sec: 10           # 续约周期，建议 <= lock-ttl-sec / 3
#   instance-id: ""                  # 留空自动生成 <hostname>-<pid>-<rand>
#   redis-timeout-sec: 3
#   require-redis: false             # true = Redis 不可用即启动失败（生产集群建议 true）
#
# 说明：require-redis=false 时 Redis 故障会降级为「每副本自认 leader」，
# 适合从单副本平滑迁移；但多副本下会重复写网关，生产集群请置 true。
# ===========================================================================
