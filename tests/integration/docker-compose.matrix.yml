# 多版本适配验证矩阵
#
# Nacos  1.4.6 / 2.5.5 / 3.3.0
# APISIX 2.15   / 3.9.1
# Kong   2.8.1  / 3.7.1
#
# 用法: ./run_matrix.sh up && ./run_matrix.sh probe && ./run_matrix.sh test && ./run_matrix.sh down
# 说明: 镜像 tag 可按本地缓存调整；Nacos 3.x 若强制鉴权，需在 matrix_check.py 里补 accessToken。

name: discovery-syncer-matrix

services:
  # ---------------- Nacos 1.x ----------------
  nacos1:
    image: nacos/nacos-server:v1.4.6
    container_name: ds-nacos1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "18848:8848"

  # ---------------- Nacos 2.x (需要 8848 + 9848) ----------------
  nacos2:
    image: nacos/nacos-server:v2.5.5
    container_name: ds-nacos2
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "28848:8848"
      - "29848:9848"
      - "29849:9849"

  # ---------------- Nacos 3.x (8848 + 9848 + console 8080) ----------------
  nacos3:
    image: nacos/nacos-server:v3.3.0
    container_name: ds-nacos3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "VGhpSXNJc0EzMkJ5dGVTZWNyZXRLZXlGb3JUZXN0T25seTEyMzQ1Ng=="
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
      JVM_XMS: 512m
      JVM_XMX: 512m
    ports:
      - "38848:8848"
      - "39848:9848"
      - "38080:8080"

  # ---------------- APISIX 2.x + etcd 3.4 (v2 API) ----------------
  etcd2:
    image: bitnami/etcd:3.4.27
    container_name: ds-etcd2
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ENABLE_V2: "true"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd2:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
  apisix2:
    image: apache/apisix:2.15-alpine
    container_name: ds-apisix2
    depends_on: [etcd2]
    volumes:
      - ./apisix2-config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "29080:9080"

  # ---------------- APISIX 3.x + etcd 3.5 ----------------
  etcd3:
    image: bitnami/etcd:3.5.16
    container_name: ds-etcd3
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd3:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
  apisix3:
    image: apache/apisix:3.9.1-debian
    container_name: ds-apisix3
    depends_on: [etcd3]
    volumes:
      - ./apisix3-config.yaml:/usr/local/apisix/conf/config.yaml:ro
    ports:
      - "39180:9180"

  # ---------------- Kong 2.8 ----------------
  kong2-db:
    image: postgres:13-alpine
    container_name: ds-kong2-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
  kong2-migrations:
    image: kong:2.8.1
    container_name: ds-kong2-migrations
    depends_on: [kong2-db]
    environment: &kong2env
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong2-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    restart: on-failure
  kong2:
    image: kong:2.8.1
    container_name: ds-kong2
    depends_on:
      kong2-migrations:
        condition: service_completed_successfully
    environment: *kong2env
    ports:
      - "28001:8001"

  # ---------------- Kong 3.7 ----------------
  kong3-db:
    image: postgres:13-alpine
    container_name: ds-kong3-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
  kong3-migrations:
    image: kong:3.7.1
    container_name: ds-kong3-migrations
    depends_on: [kong3-db]
    environment: &kong3env
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong3-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap
    restart: on-failure
  kong3:
    image: kong:3.7.1
    container_name: ds-kong3
    depends_on:
      kong3-migrations:
        condition: service_completed_successfully
    environment: *kong3env
    ports:
      - "38001:8001"
